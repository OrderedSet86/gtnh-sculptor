name: Release

# Manual only. Run this from the Actions tab, type the version, and it does the rest --
# tags the commit, builds, and publishes.
#
# Deliberately not triggered by pushing a tag. This workflow creates the tag itself, so a
# tag-push trigger would fire a second run for the tag this run just made, and the two would
# race to publish the same release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as a draft (review before publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The mod version is derived from git tags, so the full history and tags are needed
          # for the build to name the jar after the release rather than a commit hash.
          fetch-depth: 0

      - name: Validate version
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version like 0.1.0 or 0.2.0-rc1"
            exit 1
          fi
          # Catching this here gives a clear message, rather than a confusing push rejection
          # several minutes into the build.
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::tag $version already exists. Delete it first, or pick another version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # Before tagging on purpose. A version with no changelog section is a mistake, and
      # catching it here means there is no pushed tag to clean up afterwards.
      - name: Build the release body
        run: |
          set -euo pipefail

          grep -q '^<!-- changelog -->$' .github/release-preamble.md \
            || { echo "::error::.github/release-preamble.md has lost its <!-- changelog --> marker"; exit 1; }

          # The notes live in CHANGELOG.md rather than in this file, so the prose has one
          # home and cannot drift between the repository and the release page.
          awk -v heading="## $version" '
            $0 == heading      { inside = 1; next }
            inside && /^## /   { exit }
            inside             { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ -z "$(tr -d '[:space:]' < /tmp/notes.md)" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section. Write one and re-run."
            exit 1
          fi

          awk '$0 == "<!-- changelog -->" {
                 while ((getline line < "/tmp/notes.md") > 0) print line
                 next
               }
               { print }' .github/release-preamble.md > release-body.md

          cat release-body.md

      - name: Tag the release commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tag before building: the jar takes its version from the tag, so building first
          # would produce an artifact named after a commit instead.
          git tag -a "$version" -m "Sculptor $version"
          git push origin "$version"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Must match toolchainVersion in gradle/gradle-daemon-jvm.properties.
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Identify release jar
        id: jar
        run: |
          set -euo pipefail
          # The distributable is the reobfuscated jar: not -dev (deobfuscated, for developing
          # against this mod), not -preshadow (before dependency shading), not -sources.
          #
          # `|| true` matters: under `set -e` an empty match would abort here, so the
          # diagnostic below would never run and the failure would be a bare "ls: cannot
          # access" with no listing of what was actually built.
          jar=$(ls build/libs/sculptor-*.jar 2>/dev/null \
                | grep -v -- '-dev' \
                | grep -v -- '-preshadow' \
                | grep -v -- '-sources' \
                | head -1 || true)
          if [ -z "$jar" ]; then
            echo "::error::no release jar found in build/libs"
            ls -la build/libs >&2 || true
            exit 1
          fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Release jar: $jar"
          sha256sum "$jar"

      - name: Verify jar identity
        run: |
          set -euo pipefail
          # A jar that declares the wrong mod id collides with WorldEdit for everyone who
          # installs it, and the id lives in a generated file rather than one you can read off
          # the source -- so check it rather than assume.
          unzip -p "${{ steps.jar.outputs.path }}" mcmod.info > /tmp/mcmod.info
          cat /tmp/mcmod.info
          grep -q '"modid": *"sculptor"' /tmp/mcmod.info \
            || { echo "::error::jar does not declare modid=sculptor"; exit 1; }
          grep -q "\"version\": *\"$version\"" /tmp/mcmod.info \
            || { echo "::error::jar version does not match the requested version $version"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: Sculptor ${{ env.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.jar.outputs.path }}
            build/libs/sculptor-*-sources.jar
          # Assembled from .github/release-preamble.md and the CHANGELOG.md section for this
          # version. Edit those, not this file.
          body_path: release-body.md

      - name: Clean up tag on failure
        if: failure()
        run: |
          # The tag is pushed before the build, so a failed build would otherwise leave a tag
          # behind that blocks retrying the same version.
          git push --delete origin "$version" || true
